openapi: 3.0.1
info:
  title: Minha API na Prática
  description: Atividade Prática Construção da Minha API
  version: 0.0.1
servers:
  - url: "http://localhost:3000"
    description: "Ambiente de desenvolvimento" 
tags:
  - produtos
paths:
  /produtos:
    get:
      tags:
        - produtos:
      responses:
        200:
          description: Uma lista de produtos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
    post:
      tags:
        - produtos:
      requestBody:
        description: Um JSON com dados do novo produto
        required: true
        content:
          application/json:
      responses:
        201:
          description: Produto criado com sucesso
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        422:
          description: Nome e preço são obrigatórios
  /produtos/id:
    get:
      tags:
        - produtos:
      parameters:
        in: path
        name: produtoId
        type:
          schema: integer
        required: true
      description: Id do produto a ser buscado
      responses:
        200:
          description: Um JSON com os dados do produto encontrado
          content:
            application/json:
        404:
          description: Produto não encontrado
    put:
      tags:
        - produtos:
      parameters:
        in: path
        name: produtoId
        type:
          schema: integer
        required: true
      description: Id do produto a ser buscado
      requestBody:
        description: Um JSON com dados do produto a atualizar
        required: true
        content: 
          application/json:
            $ref: '#/components/schemas/Produto'
      responses:
        200:
          description: Um JSON com os dados do produto atualizado
          content:
            application/json:
              $ref: '#/components/schemas/Produto'
        404:
          description: Produto não encontrado
        422:
          description: Nome e preço são obrigatórios
    delete:
      tags:
        - produtos:
      parameters:
        in: path
        name: produtoId
        type:
          schema: integer
        required: true
      description: Id do produto a ser buscado
      responses:
        204:
          description: Produto removido com sucesso
        404:
          description: Produto não encontrado
components:
  schemas:
    ArrayOfProdutos:
      type: array
      items: 
        $ref: '#/components/schemas/Produto'
    Produto:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string 
        preco:
          type: number
  